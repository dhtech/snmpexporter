# The agent .github/try.sh polls: Debian's snmpd on the loopback
# address, a port of its own, read-only for one SNMPv2c community and
# one SNMPv3 account (SHA + AES, as our devices are asked). The
# passphrases are for this trial only.
agentaddress udp:127.0.0.1:1161
rocommunity trycommunity 127.0.0.1
createUser tryuser SHA "try-auth-passphrase" AES "try-priv-passphrase"
rouser tryuser priv
sysLocation the trial container
sysContact nobody
